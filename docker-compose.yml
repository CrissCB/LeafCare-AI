services:
  # Backend local: PocketBase (API + panel admin)
  pocketbase:
    hostname: pocketbase
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
      args:
        PB_VERSION: "0.40.5"
    container_name: pocketbase_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - TZ=UTC
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend local: Nginx sirviendo el build/web compilado localmente
  frontend:
    image: nginx:alpine
    container_name: leafcare_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./leafcare_ia/build/web:/usr/share/nginx/html:ro
      # Monta la configuración personalizada de Nginx
      - ./leafcare_ia/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
    driver: local